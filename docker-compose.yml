version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: bytevox-db
    environment:
      POSTGRES_USER: bytevox
      POSTGRES_PASSWORD: bytevox
      POSTGRES_DB: bytevox_exchange
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bytevox -d bytevox_exchange"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: bytevox-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://bytevox:bytevox@db:5432/bytevox_exchange
      CORS_ORIGINS: '["http://localhost","http://localhost:80","http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: bytevox-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
